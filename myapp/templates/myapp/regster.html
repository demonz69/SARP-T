<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTransit - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="auth-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-leaf"></i></div>
            <div class="logo-text"><span class="eco">Eco</span><span class="transit">Transit</span></div>
        </div>

        <h1>Create Your Account</h1>
        <p class="subtitle">Join the community of green travelers.</p>

        <!-- Django Register Form -->
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" name="full_name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <i class="fa-regular fa-id-badge"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <i class="fa-solid fa-lock" style="color: #a3d977;"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Log In</a>
        </div>
    </div>

</body>
</html>
