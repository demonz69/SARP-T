<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARP-T Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map-placeholder {
            background: #e5e7eb;
            background-image: url('https://www.google.com/maps/d/u/0/thumbnail?mid=1_f_N-f_0'); /* Mock map background */
            background-size: cover;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between">
        <h1 class="text-xl font-bold tracking-tight">SARP-T <span class="font-light text-sm">| Passenger Portal</span></h1>
        <div class="text-sm bg-green-500 px-2 py-1 rounded">System Online</div>
    </nav>

    <div class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Live Map -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center">
                    <h2 class="font-bold text-gray-700 underline decoration-blue-500">Real-Time Vehicle Tracking</h2>
                    <span class="text-xs text-gray-500 italic">Updating every 5s...</span>
                </div>
                <!-- Mock Map -->
                <div id="map-placeholder" class="h-96 relative flex items-center justify-center">
                    <!-- The "Moving" Bus Icon -->
                    <div id="bus-icon" class="absolute bg-blue-600 text-white p-2 rounded-full shadow-lg pulse transition-all duration-1000 ease-in-out" style="top: 40%; left: 30%;">
                        🚌
                    </div>
                    <p class="text-gray-400 font-bold uppercase tracking-widest opacity-30">Google Maps API Integration</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Vehicle & Driver Info -->
        <div class="space-y-6">
            
            <!-- Driver Status Card -->
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-600">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-4">Current Driver</h3>
                <div class="flex items-center space-x-4">
                    <div class="h-16 w-16 bg-gray-200 rounded-full flex items-center justify-center text-2xl">👤</div>
                    <div>
                        <p class="font-bold text-lg text-gray-800">Bickey Rai</p>
                        <p class="text-green-600 text-xs font-semibold">● Verified Authenticated</p>
                        <p class="text-gray-500 text-xs mt-1">ID: 24045846</p>
                    </div>
                </div>
            </div>

            <!-- Live Speedometer (IoT Simulation) -->
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-orange-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-2">Live Speed (IoT Feed)</h3>
                <div class="flex items-baseline space-x-2">
                    <span id="speed-val" class="text-4xl font-black text-gray-800 tracking-tighter">42</span>
                    <span class="text-gray-500 font-bold">km/h</span>
                </div>
                <div id="speed-warning" class="mt-2 text-xs font-bold text-red-500 hidden">⚠️ WARNING: OVER-SPEEDING</div>
            </div>

            <!-- Feedback Module -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-4">Passenger Feedback</h3>
                <textarea class="w-full border p-2 rounded text-sm mb-2" placeholder="How is your journey?"></textarea>
                <button onclick="alert('Feedback Submitted!')" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition">Submit Feedback</button>
            </div>

        </div>
    </div>

    <script>
        // Simple Simulation Logic
        const bus = document.getElementById('bus-icon');
        const speedText = document.getElementById('speed-val');
        const speedWarn = document.getElementById('speed-warning');

        setInterval(() => {
            // Randomly move the bus to simulate GPS tracking
            let top = Math.floor(Math.random() * 60) + 20;
            let left = Math.floor(Math.random() * 60) + 20;
            bus.style.top = top + "%";
            bus.style.left = left + "%";

            // Randomly change speed to simulate Speed Sensor
            let speed = Math.floor(Math.random() * 40) + 30;
            speedText.innerText = speed;

            // Trigger alert if "over-speeding" (simulated)
            if(speed > 60) {
                speedWarn.classList.remove('hidden');
                speedText.classList.add('text-red-600');
            } else {
                speedWarn.classList.add('hidden');
                speedText.classList.remove('text-red-600');
            }
        }, 3000);
    </script>
</body>
</html>
